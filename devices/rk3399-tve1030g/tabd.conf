# tabd.conf for the reference board (rk3399-tve1030g): a known-good start, copied to the tablet by
#   TABD_CONF=devices/rk3399-tve1030g/tabd.conf sh native/tabd/run.sh push
# The keys are explained in native/tabd/tabd.conf.example. The tablet's own copy, with its PC's address and the Wi-Fi
# country, is never in git. Everything not set here (eDP, Goodix-TS, the backlight, vendor.hwcomposer-2-1, the adb
# allow-list: this build's adb is unauthenticated) is found by itself.

# pc: a site's setting, not the board's, and not here. Default auto (the last good session's address, then mDNS) on
# Sunshine's default port; with a moved port (pc/install.ps1 -Port N), pc = :N. run.sh push keeps the tablet's own
# pc line when it pushes this file.
# this board has the LSM6DS3 accelerometer that tabd's orientation hook reads
orient = auto
input = 1
# its decoder takes up to 20 Mbps, FEC included
bitrate = 18000
links = eth0 wlan0
# r8168 can't read its MAC from Rockchip vendor storage, so it picks a random one every boot
fixed_mac = eth0
